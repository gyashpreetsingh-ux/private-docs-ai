version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: private-docs-ai-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:///./data/app.db
      - CHROMA_PATH=./data/chroma
      - UPLOAD_DIR=./data/uploads
      - EXPORT_DIR=./data/exports
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: private-docs-ai-frontend
    restart: unless-stopped
    ports:
      - "5174:80"
    depends_on:
      - backend

networks:
  default:
    name: private-docs-network
